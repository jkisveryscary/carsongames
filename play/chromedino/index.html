<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>T-Rex Runner</title>
  <link rel="stylesheet" href="dino.css">
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="dino.js"></script>
  <script src="/assets/theme-loader.js"></script>
</head>
<body id="t" class="offline">

  <div id="main-frame-error" class="interstitial-wrapper">
    <div id="main-content">
      <div class="icon icon-offline" alt=""></div>
    </div>
  </div>

  <div class="leaderboard-card" id="leaderboard-card">
    <div class="leaderboard-header">HIGH SCORES</div>
    <div class="leaderboard-slots" id="leaderboard-slots">
      <div class="leaderboard-loading">LOADING...</div>
    </div>
    <div class="leaderboard-footer" id="leaderboard-footer">
      Sign in to save your high scores!
    </div>
  </div>

  <div id="offline-resources">
    <img id="offline-resources-1x" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABNEAAABEBAMAAABdZr6uAAAAGFBMVEUAAAD////a2tr/9/e6urpTU1P39/e5ubkY2m5RAAAAAXRSTlMAQObYZgAACRdJREFUeAHt3cFuo0gQBuDCvWiu1IG7lSdAQtxzmAcAWbVvkJzntq+/cfPDFHGB29gdcNK/Zj3tKgIJ+bYBJ2boeyUlJSUl40kKCsnh5UiBYWuTGHARUkDquhrHrq7pagOxGy8vL8ujqwvQkFciyqU9...">
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. SUPABASE CONFIGURATION
    // -------------------------------------------------------------
    const SUPABASE_URL = 'https://hbynnertatvxpvtqctyg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhieW5uZXJ0YXR2eHB2dHFjdHlnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0OTA1NDYsImV4cCI6MjEwMDA2NjU0Nn0.xFX8E9H_WxZArOi-Vesan9T4p9bZEk23sqUTwicpHvs';
    
    let supabase = null;
    let currentUser = null;

    try {
      if (SUPABASE_URL && !SUPABASE_URL.includes('YOUR_SUPABASE_URL')) {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (err) {
      console.warn('Supabase initialization failed or keys are not set yet.');
    }

    // Fetch and display high scores publicly for everyone
    async function loadLeaderboard() {
      const container = document.getElementById('leaderboard-slots');
      if (!container) return;

      if (!supabase) {
        container.innerHTML = '<div class="leaderboard-loading">NO SCORES YET</div>';
        return;
      }

      const { data, error } = await supabase
        .from('dino_scores')
        .select('username, score')
        .order('score', { ascending: false });

      if (error || !data || data.length === 0) {
        container.innerHTML = '<div class="leaderboard-loading">NO SCORES YET</div>';
        return;
      }

      container.innerHTML = '';
      data.forEach((entry) => {
        const slot = document.createElement('div');
        slot.className = 'leaderboard-slot';
        
        const usernameEl = document.createElement('span');
        usernameEl.className = 'slot-username';
        usernameEl.textContent = entry.username || 'ANONYMOUS';

        const scoreEl = document.createElement('span');
        scoreEl.className = 'slot-score';
        scoreEl.textContent = String(entry.score).padStart(5, '0');

        slot.appendChild(usernameEl);
        slot.appendChild(scoreEl);
        container.appendChild(slot);
      });
    }

    // Save score upon crashing ONLY if signed in
    async function saveHighScore(newScore) {
      if (!supabase || !currentUser) return;

      const userId = currentUser.id;
      const username = currentUser.user_metadata?.username || currentUser.email?.split('@')[0] || 'PLAYER';

      const { data, error } = await supabase
        .from('dino_scores')
        .select('score')
        .eq('user_id', userId)
        .maybeSingle();

      if (!error) {
        if (!data || newScore > data.score) {
          await supabase
            .from('dino_scores')
            .upsert({
              user_id: userId,
              username: username,
              score: newScore,
              updated_at: new Date().toISOString()
            });

          loadLeaderboard();
        }
      }
    }

    // -------------------------------------------------------------
    // 2. ENGINE HOOKS (BEFORE GAME LOAD)
    // -------------------------------------------------------------
    if (typeof Runner !== 'undefined') {
      const originalGameOver = Runner.prototype.gameOver;
      Runner.prototype.gameOver = function() {
        originalGameOver.apply(this, arguments);
        const finalScore = Math.ceil(this.distanceRan);
        saveHighScore(finalScore);
      };
    }

    // -------------------------------------------------------------
    // 3. LAUNCH GAME & FETCH SESSION
    // -------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', async () => {
      // Initialize Chrome Dino runner
      window.runnerInstance = new Runner('.interstitial-wrapper');

      // Check session state and update footer note
      if (supabase) {
        const { data: { session } } = await supabase.auth.getSession();
        const footer = document.getElementById('leaderboard-footer');
        
        if (session) {
          currentUser = session.user;
          if (footer) footer.style.display = 'none'; // Hide notice when signed in
        } else if (footer) {
          footer.style.display = 'block'; // Show notice when not signed in
        }
      }
      
      // Load public leaderboard for all users regardless of login state
      loadLeaderboard();
    });
  </script>
</body>
</html>
